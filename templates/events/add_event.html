{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Event</title>

    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>

<body>

    <aside class="sidebar">

        <div class="logo">
            🎓 CampusEvents
        </div>

        <nav class="menu">

            <a href="{% url 'dashboard' %}">
                🏠 Dashboard
            </a>

            <a href="{% url 'events' %}">
                📅 Events
            </a>

            <a class="active" href="{% url 'add_event' %}">
                ➕ Add Event
            </a>

            <a href="#">
                👥 Participants
            </a>

            <a href="#">
                📊 Analytics
            </a>

            <a href="#">
                🔔 Notifications
            </a>

            <a href="#">
                ⚙️ Settings
            </a>

        </nav>

        <div class="logout">
            🚪 Logout
        </div>

    </aside>


    <main class="main">

        <header class="topbar">
            <div>
                <h1>Add Event</h1>
                <p>Create a new college event.</p>
            </div>
        </header>


        <section class="form-card">

            <h1>Event Information</h1>

            <p class="subtitle">
                Enter the details of the new event.
            </p>

            <form method="POST">

                {% csrf_token %}

                <p>
                    <label for="name">Event Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter event name"
                        required
                    >
                </p>


                <p>
                    <label for="description">Description</label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Enter event description"
                        required
                    ></textarea>
                </p>


                <p>
                    <label for="date">Date</label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >
                </p>


                <p>
                    <label for="time">Time</label>

                    <input
                        type="time"
                        id="time"
                        name="time"
                        required
                    >
                </p>


                <p>
                    <label for="venue">Venue</label>

                    <input
                        type="text"
                        id="venue"
                        name="venue"
                        placeholder="Enter venue"
                        required
                    >
                </p>


                <p>
                    <label for="organizer">Organizer</label>

                    <input
                        type="text"
                        id="organizer"
                        name="organizer"
                        placeholder="Enter organizer"
                        required
                    >
                </p>


                <p>
                    <label for="max_participants">
                        Maximum Participants
                    </label>

                    <input
                        type="number"
                        id="max_participants"
                        name="max_participants"
                        min="1"
                        placeholder="Enter maximum participants"
                        required
                    >
                </p>


                <div class="form-actions">

                    <a
                        class="secondary-button"
                        href="{% url 'events' %}"
                    >
                        Cancel
                    </a>

                    <button
                        class="primary-button"
                        type="submit"
                    >
                        Create Event
                    </button>

                </div>

            </form>

        </section>

    </main>

</body>
</html>
